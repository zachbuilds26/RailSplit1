<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Gradient for edge fade -->
    <radialGradient id="edge-fade" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-opacity="1"/>
      <stop offset="85%" stop-opacity="0.95"/>
      <stop offset="100%" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Composition wrapper with edge fade -->
  <g opacity="1" style="mask: url(#edge-fade)">

    <!-- Panel 03 - Settlement (upper right, behind, rotated +6deg) -->
    <g transform="translate(920, 180) rotate(6)" opacity="0.75">
      <!-- Panel border -->
      <rect x="0" y="0" width="260" height="280" rx="4"
            fill="#000000" stroke="#F5F5F5" stroke-width="0.8"/>

      <!-- Inner subtle border -->
      <rect x="12" y="12" width="236" height="256" rx="2"
            fill="none" stroke="#F5F5F5" stroke-width="0.25" opacity="0.3"/>

      <!-- Checkmark icon -->
      <circle cx="40" cy="50" r="12" fill="none" stroke="#F5F5F5" stroke-width="1"/>
      <path d="M34,50 L38,54 L46,46" fill="none" stroke="#F5F5F5" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Settled text -->
      <text x="60" y="55" font-family="sans-serif" font-size="12" font-weight="500"
            fill="#F5F5F5" opacity="0.9">
        Settled
      </text>

      <!-- Divider -->
      <line x1="24" y1="80" x2="236" y2="80" stroke="#F5F5F5" stroke-width="0.3" opacity="0.25"/>

      <!-- Field rows -->
      <g transform="translate(24, 105)">
        <!-- Row 1: Merchant Wallet -->
        <line x1="0" y1="0" x2="212" y2="0" stroke="#F5F5F5" stroke-width="0.25" opacity="0.2"/>
        <text x="0" y="20" font-family="sans-serif" font-size="8" font-weight="400"
              fill="#F5F5F5" opacity="0.5">
          Merchant Wallet
        </text>
        <line x1="0" y1="32" x2="212" y2="32" stroke="#F5F5F5" stroke-width="0.25" opacity="0.2"/>
      </g>

      <g transform="translate(24, 165)">
        <!-- Row 2: Amount -->
        <text x="0" y="20" font-family="sans-serif" font-size="16" font-weight="600"
              fill="#F5F5F5" opacity="0.95">
          $125.00
        </text>
        <line x1="0" y1="32" x2="212" y2="32" stroke="#F5F5F5" stroke-width="0.25" opacity="0.2"/>
      </g>

      <g transform="translate(24, 220)">
        <!-- Row 3: Status indicator -->
        <rect x="0" y="0" width="60" height="20" rx="2"
              fill="none" stroke="#F5F5F5" stroke-width="0.3" opacity="0.3"/>
        <text x="30" y="14" font-family="sans-serif" font-size="7" font-weight="500"
              fill="#F5F5F5" opacity="0.4" text-anchor="middle">
          Complete
        </text>
      </g>
    </g>

    <!-- Panel 01 - Set Price (upper left, behind, rotated -5deg) -->
    <g transform="translate(560, 140) rotate(-5)" opacity="0.78">
      <!-- Panel border -->
      <rect x="0" y="0" width="280" height="240" rx="4"
            fill="#000000" stroke="#F5F5F5" stroke-width="0.8"/>

      <!-- Inner subtle border -->
      <rect x="12" y="12" width="256" height="216" rx="2"
            fill="none" stroke="#F5F5F5" stroke-width="0.25" opacity="0.3"/>

      <!-- Amount field -->
      <g transform="translate(24, 45)">
        <text x="0" y="0" font-family="sans-serif" font-size="7" font-weight="400"
              fill="#F5F5F5" opacity="0.4">
          Amount
        </text>
        <rect x="0" y="8" width="232" height="55" rx="3"
              fill="none" stroke="#F5F5F5" stroke-width="0.6"/>
        <text x="12" y="45" font-family="sans-serif" font-size="24" font-weight="600"
              fill="#F5F5F5" opacity="0.95">
          $125.00
        </text>
      </g>

      <!-- Currency field -->
      <g transform="translate(24, 125)">
        <text x="0" y="0" font-family="sans-serif" font-size="7" font-weight="400"
              fill="#F5F5F5" opacity="0.4">
          Currency
        </text>
        <rect x="0" y="8" width="90" height="28" rx="2"
              fill="none" stroke="#F5F5F5" stroke-width="0.4" opacity="0.6"/>
        <text x="12" y="28" font-family="sans-serif" font-size="11" font-weight="500"
              fill="#F5F5F5" opacity="0.85">
          USD
        </text>
      </g>

      <!-- Create Link button -->
      <g transform="translate(24, 172)">
        <rect x="0" y="0" width="110" height="30" rx="2"
              fill="none" stroke="#F5F5F5" stroke-width="0.7"/>
        <text x="55" y="19" font-family="sans-serif" font-size="9" font-weight="500"
              fill="#F5F5F5" opacity="0.85" text-anchor="middle">
          Create Link
        </text>
      </g>
    </g>

    <!-- Panel 02 - Payment Link (center, largest, front, no rotation) -->
    <g transform="translate(650, 260)">
      <!-- Panel border -->
      <rect x="0" y="0" width="440" height="300" rx="5"
            fill="#000000" stroke="#F5F5F5" stroke-width="1"/>

      <!-- Inner subtle border -->
      <rect x="15" y="15" width="410" height="270" rx="3"
            fill="none" stroke="#F5F5F5" stroke-width="0.3" opacity="0.35"/>

      <!-- Header section -->
      <g transform="translate(30, 45)">
        <text x="0" y="0" font-family="sans-serif" font-size="8" font-weight="400"
              fill="#F5F5F5" opacity="0.5" letter-spacing="1">
          PAYMENT LINK
        </text>
        <line x1="0" y1="12" x2="380" y2="12" stroke="#F5F5F5" stroke-width="0.25" opacity="0.2"/>
      </g>

      <!-- Link field -->
      <g transform="translate(30, 85)">
        <rect x="0" y="0" width="380" height="85" rx="3"
              fill="none" stroke="#F5F5F5" stroke-width="0.8"/>
        <rect x="6" y="6" width="368" height="73" rx="2"
              fill="none" stroke="#F5F5F5" stroke-width="0.2" opacity="0.25"/>

        <!-- Link text -->
        <text x="20" y="38" font-family="sans-serif" font-size="13" font-weight="500"
              fill="#F5F5F5" opacity="0.9">
          railsplit.onrender.com/
        </text>
        <text x="20" y="60" font-family="sans-serif" font-size="13" font-weight="500"
              fill="#F5F5F5" opacity="0.9">
          pay/merchant-125
        </text>
      </g>

      <!-- Copy button -->
      <g transform="translate(30, 190)">
        <rect x="0" y="0" width="85" height="28" rx="2"
              fill="none" stroke="#F5F5F5" stroke-width="0.5" opacity="0.7"/>
        <text x="42" y="18" font-family="sans-serif" font-size="9" font-weight="500"
              fill="#F5F5F5" opacity="0.75" text-anchor="middle">
          Copy
        </text>
      </g>

      <!-- Dividers at bottom -->
      <line x1="30" y1="238" x2="410" y2="238" stroke="#F5F5F5" stroke-width="0.2" opacity="0.15"/>
      <line x1="30" y1="250" x2="410" y2="250" stroke="#F5F5F5" stroke-width="0.2" opacity="0.1"/>
    </g>

  </g>
</svg>
